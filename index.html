<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>স্মার্ট বিলিং কাউন্টার | Smart POS</title>
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #f59e0b;
      --bg: #121212;
      --card-bg: #1e1e24;
      --surface: #282830;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --success: #10b981;
      --danger: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px 16px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
    .brand-title { font-size: 16px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .top-actions { display: flex; gap: 6px; align-items: center; }
    .btn-action { background: var(--surface); color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-lang { background: #3b82f6; color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .hero-summary { background: linear-gradient(180deg, #1c1917 0%, #121212 100%); padding: 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .banner-preview-img { max-width: 100%; height: 90px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; border: 1px solid #333; display: none; }
    .shop-name { font-size: 22px; font-weight: 800; color: #fff; }
    .shop-loc { font-size: 13px; color: var(--primary); margin-bottom: 8px; }
    .daily-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }

    .filter-section { max-width: 900px; margin: 12px auto; padding: 0 14px; }
    .search-input { width: 100%; padding: 12px 14px; background: var(--card-bg); border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 15px; outline: none; margin-bottom: 10px; }
    .search-input:focus { border-color: var(--primary); }
    .cats-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .cats-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 6px 14px; background: var(--surface); border: 1px solid #444; border-radius: 20px; color: var(--muted); font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; max-width: 900px; margin: 0 auto; padding: 0 14px; }
    .food-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .food-thumb { width: 100%; height: 130px; object-fit: cover; background: #262626; }
    .card-details { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .item-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .item-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    
    .size-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
    .size-btn { flex: 1; padding: 6px 4px; background: var(--surface); border: 1px solid #444; color: #fff; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
    .size-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .btn-add-cart { background: var(--blue); color: #fff; border: none; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .floating-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1c1c1e; border-top: 2px solid var(--primary); padding: 12px 18px; display: none; justify-content: space-between; align-items: center; z-index: 999; }
    .cart-summary { font-size: 13px; color: var(--muted); }
    .cart-total-price { font-size: 19px; font-weight: 800; color: var(--primary); }
    .btn-open-bill { background: var(--success); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .modal-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 14px; }
    .modal-box { background: #fff; color: #111; width: 100%; max-width: 440px; border-radius: 12px; padding: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #444; padding-bottom: 10px; margin-bottom: 12px; }
    .btn-modal-close { background: #fee2e2; color: var(--danger); border: 2px solid var(--danger); width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }

    .memo-row { display: flex; justify-content: space-between; align-items: center; background: #f4f4f5; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .qty-btn { width: 28px; height: 28px; border: 1px solid #ccc; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; margin: 10px 0; }
    #qrcodeImg { width: 140px; height: 140px; object-fit: contain; margin-bottom: 6px; display: none; }

    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-pay-c { background: #059669; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-pay-o { background: var(--blue); color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-print { grid-column: span 2; background: #18181b; color: #fff; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }

    @media print {
      body * { visibility: hidden; }
      #printableThermalBill, #printableThermalBill * { visibility: visible; }
      #printableThermalBill { position: absolute; left: 0; top: 0; width: 58mm; padding: 2mm; font-family: monospace; color: #000; font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-title"><i class="fa-solid fa-cash-register"></i> <span id="txtTopBrand">স্মার্ট বিলিং</span></div>
    <div class="top-actions">
      <button type="button" class="btn-lang" onclick="toggleLanguage()"><i class="fa-solid fa-globe"></i> <span id="btnLangText">English</span></button>
      <button type="button" class="btn-action" onclick="openShopSettings()"><i class="fa-solid fa-store"></i> <span id="txtShopBtn">দোকান</span></button>
      <button type="button" class="btn-action" onclick="openLedger()"><i class="fa-solid fa-book"></i> <span id="txtLedger">খাতা</span></button>
      <button type="button" class="btn-action" style="color:var(--primary);" onclick="openFoodManager()"><i class="fa-solid fa-plus"></i> <span id="txtMenuBtn">মেনু</span></button>
    </div>
  </div>

  <!-- Dynamic Banner & Shop Name -->
  <div class="hero-summary">
    <img id="shopBannerImg" class="banner-preview-img">
    <div class="shop-name" id="displayShopName">দোকানের নাম</div>
    <div class="shop-loc" id="displayShopLoc">দোকানের ঠিকানা বা স্লোগান</div>
    <div class="daily-badge">
      <i class="fa-solid fa-chart-line"></i> <span id="badgeSalesText">আজকের বিক্রি: হিসাব হচ্ছে...</span>
    </div>
  </div>

  <!-- Search & Category -->
  <div class="filter-section">
    <input type="text" id="searchInput" class="search-input" placeholder="খাবারের নাম দিয়ে সার্চ করুন..." oninput="renderApp()">
    <div class="cats-scroll" id="categoryScroll"></div>
  </div>

  <!-- Menu Grid -->
  <div class="menu-grid" id="menuGrid"></div>

  <!-- Floating Cart -->
  <div class="floating-bar" id="floatingCart">
    <div>
      <div class="cart-summary" id="cartItemCount">০ টি আইটেম</div>
      <div class="cart-total-price" id="cartTotalPrice">₹০</div>
    </div>
    <button type="button" class="btn-open-bill" onclick="openBillModal()"><i class="fa-solid fa-receipt"></i> <span id="txtOpenBill">মেমো ও পেমেন্ট</span></button>
  </div>

  <!-- Memo & QR Modal -->
  <div class="modal-wrap" id="billModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-weight:800;" id="txtMemoHeader">বিল মেমো</h3>
        <button type="button" class="btn-modal-close" onclick="closeModal('billModal')">✕</button>
      </div>

      <div id="memoItemsList" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;"></div>

      <div style="display:flex; justify-content:space-between; font-size: 18px; font-weight:800; border-top:2px dashed #999; padding-top:8px;">
        <span id="txtTotalDue">সর্বমোট বিল:</span>
        <span id="memoGrandTotal" style="color:var(--danger);">₹০</span>
      </div>

      <!-- UPI QR Code Section -->
      <div class="qr-container">
        <div style="font-size:12px; font-weight:bold; margin-bottom:6px; color:#475569;" id="txtScanPay">UPI QR কোড স্ক্যান করে পেমেন্ট করুন</div>
        <img id="qrcodeImg" alt="Payment QR Code">
        <div style="font-size:11px; color:#64748b;" id="upiIdNote">UPI: not set</div>
      </div>

      <div class="grid-btns">
        <button type="button" class="btn-pay-c" onclick="settleSale('Cash')">💵 <span id="txtCashBtn">ক্যাশ বিল</span></button>
        <button type="button" class="btn-pay-o" onclick="settleSale('Online')">📱 <span id="txtOnlineBtn">অনলাইন বিল</span></button>
        <button type="button" class="btn-print" onclick="printThermal()"><i class="fa-solid fa-print"></i> <span id="txtPrintBtn">থার্মাল রসিদ প্রিন্ট করুন</span></button>
      </div>
      <button type="button" onclick="clearCurrentCart()" style="width:100%; margin-top:8px; padding:6px; background:#f4f4f5; border:1px solid #ddd; border-radius:6px; font-weight:bold;" id="txtClearCart">কার্ট খালি করুন</button>
    </div>
  </div>

  <!-- Shop Settings Modal -->
  <div class="modal-wrap" id="shopSettingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-weight:800;"><i class="fa-solid fa-store"></i> <span id="txtShopSettingsTitle">দোকানের তথ্য ও ব্যানার এডিট</span></h3>
        <button type="button" class="btn-modal-close" onclick="closeModal('shopSettingsModal')">✕</button>
      </div>

      <div class="form-group">
        <label>দোকানের নাম (বাংলা):</label>
        <input type="text" id="setShopNameBn" class="form-control" placeholder="যেমন: মহা পেটুক">
      </div>
      <div class="form-group">
        <label>Shop Name (English):</label>
        <input type="text" id="setShopNameEn" class="form-control" placeholder="e.g. Maha Petuk">
      </div>
      <div class="form-group">
        <label>ঠিকানা / স্লোগান (Address / Tagline):</label>
        <input type="text" id="setShopLoc" class="form-control" placeholder="যেমন: আমতা সাহাপাড়া বাজার">
      </div>
      <div class="form-group">
        <label>UPI ID (পেমেন্ট QR কোডের জন্য):</label>
        <input type="text" id="setShopUpi" class="form-control" placeholder="e.g. 9876543210@paytm বা yourname@upi">
      </div>
      <div class="form-group">
        <label>দোকানের ব্যানার বা লোগো ছবি আপলোড করুন:</label>
        <input type="file" id="setShopBannerFile" accept="image/*" onchange="processBannerImage(event)">
        <input type="hidden" id="setShopBannerBase64">
      </div>

      <button type="button" onclick="saveShopSettings()" style="width:100%; padding:10px; background:var(--primary); color:#000; border:none; border-radius:8px; font-weight:800; margin-top:10px; cursor:pointer;">সংরক্ষণ করুন / Save</button>
    </div>
  </div>

  <!-- Sales Ledger Modal -->
  <div class="modal-wrap" id="ledgerModal">
    <div class="modal-box" style="max-width: 480px;">
      <div class="modal-header">
        <h3 style="font-weight:800;" id="txtLedgerTitle"><i class="fa-solid fa-book"></i> দৈনিক সেলস খাতা</h3>
        <button type="button" class="btn-modal-close" onclick="closeModal('ledgerModal')">✕</button>
      </div>

      <div style="display:flex; gap:6px; margin-bottom:10px;">
        <input type="date" id="ledgerDate" style="flex:1; padding:6px; border:1px solid #ccc; border-radius:6px;" onchange="renderLedger()">
        <button type="button" onclick="document.getElementById('ledgerDate').value=''; renderLedger();" style="padding:6px 10px; background:#333; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer;" id="txtAllFilter">সব</button>
        <button type="button" onclick="exportData()" style="padding:6px 10px; background:#059669; color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer;"><i class="fa-solid fa-download"></i></button>
      </div>

      <div id="ledgerStats" style="background:#f1f5f9; padding:8px; border-radius:8px; font-size:13px; font-weight:bold; margin-bottom:10px;"></div>
      <div id="ledgerRecords" style="max-height: 320px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- Food Management Modal -->
  <div class="modal-wrap" id="foodModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-weight:800;" id="txtManageHeader">খাবার যোগ / এডিট</h3>
        <button type="button" class="btn-modal-close" onclick="closeModal('foodModal')">✕</button>
      </div>
      <input type="text" id="inpNameBn" placeholder="খাবারের নাম (বাংলা)" style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #ccc; border-radius:6px;">
      <input type="text" id="inpNameEn" placeholder="Food Name (English)" style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #ccc; border-radius:6px;">
      <input type="text" id="inpCat" placeholder="Category (e.g. Roll, Chow, Snacks)" style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #ccc; border-radius:6px;">
      <div style="display:flex; gap:6px;">
        <input type="number" id="inpHalf" placeholder="Half Price (₹)" style="flex:1; padding:8px; margin-bottom:6px; border:1px solid #ccc; border-radius:6px;">
        <input type="number" id="inpFull" placeholder="Full Price (₹)" style="flex:1; padding:8px; margin-bottom:6px; border:1px solid #ccc; border-radius:6px;">
      </div>
      <input type="file" id="inpImg" accept="image/*" onchange="processFoodImage(event)" style="margin-bottom:8px;">
      <input type="hidden" id="inpImgBase64">
      <button type="button" onclick="saveFoodItem()" style="width:100%; padding:10px; background:var(--primary); color:#000; border:none; border-radius:8px; font-weight:800; cursor:pointer;" id="txtSaveMenu">মেনুতে সেভ করুন</button>

      <div id="foodListManage" style="max-height: 180px; overflow-y: auto; margin-top: 14px; border-top:1px solid #ddd; padding-top:10px;"></div>
    </div>
  </div>

  <!-- Thermal Print Hidden Area -->
  <div id="printableThermalBill" style="display:none;"></div>

  <script>
    const STORE_KEY = "Universal_Smart_POS_v6";
    let lang = localStorage.getItem("usp_lang") || "bn";

    const DEFAULT_CONFIG = {
      shop: {
        nameBn: "আপনার দোকানের নাম",
        nameEn: "Your Shop Name",
        loc: "ঠিকানা বা স্লোগান লিখুন",
        upi: "paytmqr281001000@paytm",
        banner: ""
      },
      menu: [
        { id: 1, nameBn: "স্পেশাল রোল", nameEn: "Special Roll", cat: "Roll", half: 0, full: 60, img: "" },
        { id: 2, nameBn: "ফ্রাইড রাইস", nameEn: "Fried Rice", cat: "Rice", half: 70, full: 120, img: "" }
      ],
      sales: []
    };

    let appData;
    try {
      appData = JSON.parse(localStorage.getItem(STORE_KEY)) || DEFAULT_CONFIG;
      if (!appData.shop) appData.shop = DEFAULT_CONFIG.shop;
      if (!appData.menu) appData.menu = DEFAULT_CONFIG.menu;
      if (!appData.sales) appData.sales = [];
    } catch(e) {
      appData = DEFAULT_CONFIG;
    }

    let cart = [];
    let selectedSize = {};
    let currentCategory = 'ALL';

    function saveData() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(appData));
      } catch (err) {
        alert("স্টোরেজ পূর্ণ হয়েছে! ছবির সাইজ একটু ছোট করে দিন।");
      }
    }

    function toggleLanguage() {
      lang = lang === "bn" ? "en" : "bn";
      localStorage.setItem("usp_lang", lang);
      applyLanguage();
    }

    function applyLanguage() {
      const isBn = lang === "bn";
      document.getElementById("btnLangText").textContent = isBn ? "English" : "বাংলা";
      document.getElementById("txtTopBrand").textContent = isBn ? "স্মার্ট বিলিং কাউন্টার" : "Smart POS Counter";
      document.getElementById("txtShopBtn").textContent = isBn ? "দোকান" : "Shop";
      document.getElementById("txtLedger").textContent = isBn ? "খাতা" : "Ledger";
      document.getElementById("txtMenuBtn").textContent = isBn ? "মেনু" : "Menu";
      document.getElementById("searchInput").placeholder = isBn ? "খাবারের নাম দিয়ে সার্চ করুন..." : "Search menu items...";
      document.getElementById("txtOpenBill").textContent = isBn ? "মেমো ও পেমেন্ট" : "Memo & Pay";
      document.getElementById("txtMemoHeader").textContent = isBn ? "বিল মেমো" : "Billing Memo";
      document.getElementById("txtTotalDue").textContent = isBn ? "সর্বমোট বিল:" : "Total Bill:";
      document.getElementById("txtScanPay").textContent = isBn ? "UPI QR কোড স্ক্যান করে পেমেন্ট করুন" : "Scan UPI QR to Pay";
      document.getElementById("txtCashBtn").textContent = isBn ? "ক্যাশ বিল" : "Cash Bill";
      document.getElementById("txtOnlineBtn").textContent = isBn ? "অনলাইন বিল" : "Online Bill";
      document.getElementById("txtPrintBtn").textContent = isBn ? "থার্মাল রসিদ প্রিন্ট করুন" : "Print Thermal Receipt";
      document.getElementById("txtClearCart").textContent = isBn ? "কার্ট খালি করুন" : "Clear Cart";
      document.getElementById("txtShopSettingsTitle").textContent = isBn ? "দোকানের তথ্য ও ব্যানার এডিট" : "Edit Shop Profile & Banner";
      document.getElementById("txtLedgerTitle").innerHTML = isBn ? '<i class="fa-solid fa-book"></i> দৈনিক সেলস খাতা' : '<i class="fa-solid fa-book"></i> Daily Sales Ledger';
      document.getElementById("txtAllFilter").textContent = isBn ? "সব" : "All";
      document.getElementById("txtManageHeader").textContent = isBn ? "খাবার যোগ / এডিট" : "Manage Menu Items";
      document.getElementById("txtSaveMenu").textContent = isBn ? "মেনুতে সেভ করুন" : "Save to Menu";

      updateShopHeader();
      renderCategories();
      renderApp();
      updateTodayBadge();
    }

    function updateShopHeader() {
      const s = appData.shop;
      document.getElementById("displayShopName").textContent = lang === 'bn' ? (s.nameBn || s.nameEn) : (s.nameEn || s.nameBn);
      document.getElementById("displayShopLoc").textContent = s.loc || '';
      
      const bannerEl = document.getElementById("shopBannerImg");
      if (s.banner && s.banner.length > 50) {
        bannerEl.src = s.banner;
        bannerEl.style.display = "inline-block";
      } else {
        bannerEl.style.display = "none";
      }
      document.getElementById("upiIdNote").textContent = `UPI: ${s.upi || 'Not set'}`;
    }

    function openShopSettings() {
      const s = appData.shop;
      document.getElementById("setShopNameBn").value = s.nameBn || "";
      document.getElementById("setShopNameEn").value = s.nameEn || "";
      document.getElementById("setShopLoc").value = s.loc || "";
      document.getElementById("setShopUpi").value = s.upi || "";
      document.getElementById("setShopBannerBase64").value = s.banner || "";
      document.getElementById("shopSettingsModal").style.display = "flex";
    }

    function saveShopSettings() {
      appData.shop.nameBn = document.getElementById("setShopNameBn").value.trim() || "দোকানের নাম";
      appData.shop.nameEn = document.getElementById("setShopNameEn").value.trim() || "Shop Name";
      appData.shop.loc = document.getElementById("setShopLoc").value.trim();
      appData.shop.upi = document.getElementById("setShopUpi").value.trim();
      appData.shop.banner = document.getElementById("setShopBannerBase64").value;

      saveData();
      updateShopHeader();
      closeModal("shopSettingsModal");
      alert(lang === 'bn' ? "✅ তথ্য সেভ হয়েছে!" : "✅ Shop info saved!");
    }

    function processBannerImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageHelper(file, 600, 0.7, function(base64) {
        document.getElementById("setShopBannerBase64").value = base64;
      });
    }

    function processFoodImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageHelper(file, 400, 0.7, function(base64) {
        document.getElementById("inpImgBase64").value = base64;
      });
    }

    function compressImageHelper(file, maxW, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const cvs = document.createElement("canvas");
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(cvs.toDataURL("image/jpeg", quality));
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderCategories() {
      const cats = ['ALL', ...new Set(appData.menu.map(m => m.cat || 'General'))];
      document.getElementById('categoryScroll').innerHTML = cats.map(c => `
        <button type="button" class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCat('${c}')">
          ${c === 'ALL' ? (lang === 'bn' ? 'সব খাবার' : 'All Items') : c}
        </button>
      `).join('');
    }

    function setCat(cat) {
      currentCategory = cat;
      renderCategories();
      renderApp();
    }

    function renderApp() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('menuGrid');

      const items = appData.menu.filter(i => {
        const matchesCat = currentCategory === 'ALL' || i.cat === currentCategory;
        const nameBn = (i.nameBn || "").toLowerCase();
        const nameEn = (i.nameEn || "").toLowerCase();
        return matchesCat && (nameBn.includes(q) || nameEn.includes(q));
      });

      if (!items.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:#777;">${lang === 'bn' ? 'কোনো খাবার পাওয়া যায়নি' : 'No items found'}</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const size = selectedSize[item.id] || (item.half > 0 ? 'half' : 'full');
        const price = size === 'half' ? item.half : item.full;
        const displayName = lang === 'bn' ? (item.nameBn || item.nameEn) : (item.nameEn || item.nameBn);
        const subName = lang === 'bn' ? item.nameEn : item.nameBn;

        return `
          <div class="food-card">
            <img src="${item.img || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text fill=%22%23666%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2222%22>🍽️</text></svg>'}" class="food-thumb">
            <div class="card-details">
              <div>
                <div class="item-name">${displayName}</div>
                <div class="item-sub">${subName || ''} • <b style="color:var(--primary);">₹${price}</b></div>
              </div>

              ${item.half > 0 ? `
                <div class="size-toggle">
                  <button type="button" class="size-btn ${size === 'half' ? 'active' : ''}" onclick="selectItemSize(${item.id}, 'half')">${lang === 'bn' ? 'হাফ' : 'Half'} (₹${item.half})</button>
                  <button type="button" class="size-btn ${size === 'full' ? 'active' : ''}" onclick="selectItemSize(${item.id}, 'full')">${lang === 'bn' ? 'ফুল' : 'Full'} (₹${item.full})</button>
                </div>
              ` : ''}

              <button type="button" class="btn-add-cart" onclick="addItemToCart(${item.id})">
                <i class="fa-solid fa-plus"></i> ${lang === 'bn' ? 'অর্ডারে যোগ' : 'Add to Order'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectItemSize(id, s) { selectedSize[id] = s; renderApp(); }

    function addItemToCart(id) {
      const item = appData.menu.find(m => m.id === id);
      const size = selectedSize[id] || (item.half > 0 ? 'half' : 'full');
      const price = size === 'half' ? item.half : item.full;
      const name = lang === 'bn' ? (item.nameBn || item.nameEn) : (item.nameEn || item.nameBn);

      const found = cart.find(c => c.id === id && c.size === size);
      if (found) found.qty++;
      else cart.push({ id, name, size, price, qty: 1 });
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const totalCount = cart.reduce((s, i) => s + i.qty, 0);
      const totalAmt = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const bar = document.getElementById('floatingCart');
      if (totalCount > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartItemCount').textContent = lang === 'bn' ? `${totalCount} টি আইটেম` : `${totalCount} Items`;
        document.getElementById('cartTotalPrice').textContent = `₹${totalAmt}`;
      } else {
        bar.style.display = 'none';
      }
    }

    function openBillModal() {
      const list = document.getElementById('memoItemsList');
      const totalAmt = cart.reduce((s, i) => s + (i.price * i.qty), 0);

      list.innerHTML = cart.map((item, index) => `
        <div class="memo-row">
          <div>
            <b>${item.name}</b> (${item.size === 'half' ? 'H' : 'F'})<br>
            <span style="color:#666;">₹${item.price} × ${item.qty} = ₹${item.price * item.qty}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <b>${item.qty}</b>
            <button type="button" class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
      `).join('');

      document.getElementById('memoGrandTotal').textContent = `₹${totalAmt}`;
      
      // Dynamic Reliable QR Generation
      const qrImg = document.getElementById('qrcodeImg');
      if (totalAmt > 0 && appData.shop.upi) {
        const upiUrl = `upi://pay?pa=${encodeURIComponent(appData.shop.upi)}&pn=${encodeURIComponent(appData.shop.nameEn || 'Shop')}&am=${totalAmt}&cu=INR`;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiUrl)}`;
        qrImg.style.display = "block";
      } else {
        qrImg.style.display = "none";
      }

      document.getElementById('billModal').style.display = 'flex';
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      if (!cart.length) closeModal('billModal');
      else openBillModal();
      updateCartDisplay();
    }

    function clearCurrentCart() {
      cart = []; updateCartDisplay(); closeModal('billModal');
    }

    function settleSale(mode) {
      if (!cart.length) return;
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const billNo = "BILL-" + String(appData.sales.length + 1).padStart(5, '0');

      appData.sales.unshift({
        id: Date.now(),
        billNo,
        items: [...cart],
        total,
        mode,
        date: new Date().toISOString()
      });

      saveData();
      alert(lang === 'bn' ? `✅ বিল সফল!\nবিল নং: ${billNo}\nমোট: ₹${total} (${mode})` : `✅ Bill Recorded!\nBill No: ${billNo}\nTotal: ₹${total} (${mode})`);
      clearCurrentCart();
      updateTodayBadge();
    }

    function printThermal() {
      if (!cart.length) return;
      const totalAmt = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const s = appData.shop;
      const billBox = document.getElementById('printableThermalBill');
      
      billBox.innerHTML = `
        <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:4px;">
          <h2 style="margin:0; font-size:16px;">${s.nameEn || s.nameBn}</h2>
          <div style="font-size:10px;">${s.loc || ''}</div>
          <div style="font-size:10px;">${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}</div>
        </div>
        <div style="margin:6px 0; border-bottom:1px dashed #000; padding-bottom:4px;">
          ${cart.map(c => `
            <div style="display:flex; justify-content:space-between; font-size:11px;">
              <span>${c.name} (${c.size === 'half' ? 'H' : 'F'}) x${c.qty}</span>
              <span>Rs.${c.price * c.qty}</span>
            </div>
          `).join('')}
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;">
          <span>TOTAL:</span>
          <span>Rs.${totalAmt}</span>
        </div>
        <div style="text-align:center; margin-top:8px; font-size:10px;">*** Thank You, Visit Again ***</div>
      `;

      billBox.style.display = 'block';
      window.print();
      billBox.style.display = 'none';
    }

    function updateTodayBadge() {
      const today = new Date().toISOString().slice(0, 10);
      const todaySales = appData.sales.filter(s => s.date.slice(0, 10) === today);
      const sum = todaySales.reduce((a, b) => a + b.total, 0);
      document.getElementById('badgeSalesText').textContent = lang === 'bn' 
        ? `আজকের বিক্রি: ${todaySales.length} টি বিল • মোট: ₹${sum}` 
        : `Today's Sales: ${todaySales.length} Bills • Total: ₹${sum}`;
    }

    function openLedger() {
      document.getElementById('ledgerDate').value = new Date().toISOString().slice(0, 10);
      renderLedger();
      document.getElementById('ledgerModal').style.display = 'flex';
    }

    function renderLedger() {
      const filterDate = document.getElementById('ledgerDate').value;
      const filtered = appData.sales.filter(s => !filterDate || s.date.slice(0, 10) === filterDate);
      const total = filtered.reduce((s, a) => s + a.total, 0);
      const cash = filtered.filter(f => f.mode === 'Cash').reduce((s, a) => s + a.total, 0);
      const online = filtered.filter(f => f.mode === 'Online').reduce((s, a) => s + a.total, 0);

      document.getElementById('ledgerStats').innerHTML = lang === 'bn'
        ? `মোট বিল: ${filtered.length} টি | মোট বিক্রি: ₹${total}<br>💵 ক্যাশ: ₹${cash} | 📱 অনলাইন: ₹${online}`
        : `Total Bills: ${filtered.length} | Total: ₹${total}<br>💵 Cash: ₹${cash} | 📱 Online: ₹${online}`;

      document.getElementById('ledgerRecords').innerHTML = filtered.map(r => `
        <div style="border-bottom:1px solid #e2e8f0; padding:8px 0; font-size:12px;">
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span>${r.billNo} • ${new Date(r.date).toLocaleTimeString()}</span>
            <span style="color:#059669;">₹${r.total} (${r.mode})</span>
          </div>
          <div style="color:#64748b;">${r.items.map(i => `${i.name}×${i.qty}`).join(', ')}</div>
        </div>
      `).join('') || `<div style="text-align:center; padding:15px; color:#999;">${lang === 'bn' ? 'কোনো বিক্রির রেকর্ড নেই' : 'No records'}</div>`;
    }

    function openFoodManager() {
      renderManageList();
      document.getElementById('foodModal').style.display = 'flex';
    }

    function renderManageList() {
      document.getElementById('foodListManage').innerHTML = appData.menu.map(m => `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13px;">
          <span><b>${m.nameBn || m.nameEn}</b> (₹${m.full})</span>
          <button type="button" onclick="deleteFood(${m.id})" style="color:red; background:none; border:none; cursor:pointer;">${lang === 'bn' ? 'মুছুন' : 'Delete'}</button>
        </div>
      `).join('');
    }

    function saveFoodItem() {
      const nameBn = document.getElementById('inpNameBn').value.trim();
      const nameEn = document.getElementById('inpNameEn').value.trim();
      const cat = document.getElementById('inpCat').value.trim() || 'General';
      const half = Number(document.getElementById('inpHalf').value) || 0;
      const full = Number(document.getElementById('inpFull').value) || 0;
      const img = document.getElementById('inpImgBase64').value;

      if ((!nameBn && !nameEn) || full <= 0) {
        alert(lang === 'bn' ? 'সঠিক নাম ও দাম দিন' : 'Valid name and price required');
        return;
      }

      appData.menu.push({ id: Date.now(), nameBn, nameEn, cat, half, full, img });
      saveData();
      renderCategories();
      renderApp();
      closeModal('foodModal');
    }

    function deleteFood(id) {
      if (!confirm(lang === 'bn' ? 'মুছে ফেলতে চান?' : 'Delete item?')) return;
      appData.menu = appData.menu.filter(m => m.id !== id);
      saveData();
      renderCategories();
      renderApp();
      renderManageList();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pos-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function closeModal(id) { 
      const el = document.getElementById(id);
      if (el) el.style.display = 'none'; 
    }

    // Initial Load
    applyLanguage();
  </script>
</body>
</html>
